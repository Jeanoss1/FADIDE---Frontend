<form class="card form-card" [formGroup]="$form()" (submit)="save()">
  <h2 class="card-title"><mat-icon>{{ $isEdit() ? 'edit' : 'engineering' }}</mat-icon> {{ $isEdit() ? 'Editar contratista' : 'Nuevo contratista' }}</h2>

  <div class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Razón social</mat-label>
      <input matInput formControlName="nombre" />
      <mat-error>El nombre es obligatorio (máx. 150 caracteres)</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>RUC</mat-label>
      <input matInput formControlName="ruc" maxlength="11" inputmode="numeric" />
      <mat-error>El RUC debe tener 11 dígitos</mat-error>
    </mat-form-field>
  </div>

  <div class="form-actions">
    <a mat-button routerLink="/pages/contratista">Cancelar</a>
    <button mat-flat-button class="btn-primary" type="submit">
      <mat-icon>done</mat-icon> {{ $isEdit() ? 'Actualizar' : 'Guardar' }}
    </button>
  </div>
</form>
