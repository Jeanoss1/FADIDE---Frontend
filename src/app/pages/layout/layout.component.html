<mat-sidenav-container class="layout">
    <mat-sidenav #sidenav class="sidebar" [mode]="$isMobile() ? 'over' : 'side'" [opened]="!$isMobile()">
        <a class="brand" routerLink="/pages/dashboard">
            <img src="images/logo-fadide.png" alt="FADIDE Ingeniería y Construcción">
        </a>

        <nav>
            @for (section of $menu(); track section.title) {
                <p class="section-title">{{ section.title }}</p>
                @for (item of section.items; track item.route) {
                    <a class="nav-item" [routerLink]="item.route" routerLinkActive="active"
                        (click)="$isMobile() && sidenav.close()">
                        <mat-icon>{{ item.icon }}</mat-icon>
                        <span>{{ item.label }}</span>
                    </a>
                }
            }
        </nav>

        <p class="sidebar-footer">SISCO v1.0 · FADIDE E.I.R.L.</p>
    </mat-sidenav>

    <mat-sidenav-content class="content">
        <header class="topbar">
            <button mat-icon-button class="menu-btn" (click)="sidenav.toggle()" matTooltip="Menú">
                <mat-icon>{{ sidenav.opened ? 'menu_open' : 'menu' }}</mat-icon>
            </button>

            <div class="user">
                <span class="avatar">{{ $initials() }}</span>
                <div>
                    <strong>{{ $session()?.nombreCompleto }}</strong>
                    <small>{{ $rolLabel() }}</small>
                </div>
            </div>

            <span class="spacer"></span>

            <button mat-stroked-button class="logout" (click)="logout()">
                <mat-icon>logout</mat-icon>
                <span>Cerrar sesión</span>
            </button>
        </header>

        <main>
            <router-outlet></router-outlet>
        </main>
    </mat-sidenav-content>
</mat-sidenav-container>
