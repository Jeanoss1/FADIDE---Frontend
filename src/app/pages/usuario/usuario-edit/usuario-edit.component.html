<form class="card form-card" [formGroup]="$form()" (submit)="save()">
  <h2 class="card-title"><mat-icon>person_add</mat-icon> Nuevo usuario</h2>

  <div class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Nombre completo</mat-label>
      <input matInput formControlName="nombreCompleto" />
      <mat-error>El nombre es obligatorio</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Correo</mat-label>
      <input matInput type="email" formControlName="correo" />
      <mat-error>Ingresa un correo válido</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Documento (DNI / RUC)</mat-label>
      <input matInput formControlName="documento" inputmode="numeric" />
      <mat-error>Entre 8 y 20 dígitos</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Rol</mat-label>
      <mat-select formControlName="idRol">
        @for (r of $roles(); track r.idRol) {
          <mat-option [value]="r.idRol">{{ rolLabel[r.nombre] ?? r.nombre }}</mat-option>
        }
      </mat-select>
      <mat-error>Selecciona un rol</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Contraseña</mat-label>
      <input matInput [type]="$hidePassword() ? 'password' : 'text'" formControlName="password" autocomplete="new-password" />
      <button mat-icon-button matSuffix type="button" (click)="$hidePassword.set(!$hidePassword())">
        <mat-icon>{{ $hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
      </button>
      <mat-error>Entre 8 y 72 caracteres</mat-error>
    </mat-form-field>
  </div>

  <div class="form-actions">
    <a mat-button routerLink="/pages/usuario">Cancelar</a>
    <button mat-flat-button class="btn-primary" type="submit"><mat-icon>done</mat-icon> Crear usuario</button>
  </div>
</form>
